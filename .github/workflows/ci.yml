name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Production builds need the Turnstile sitekey (web/src/env.ts); the check build uses Turnstile's test
      # key and confirms the value is inlined into the chat page bundle.
      - run: pnpm build
        env:
          PUBLIC_TURNSTILE_SITEKEY: 1x00000000000000000000AA
      - run: grep -rq 1x00000000000000000000AA web/build/_app

  # Formatting and validity of backend/infra/. Needs no Cloudflare access: plans run on your computer
  # (./cli.sh infra-plan), because they need the state bucket keys.
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  deploy:
    needs: [check, terraform]
    # Turn on by setting the repository variable DEPLOY_ENABLED=true once the Pages project exists
    # (./cli.sh first-setup) and the CLOUDFLARE_API_TOKEN secret is set (./cli.sh deploy-token).
    # Code only: infrastructure changes go out with ./cli.sh deploy on your computer, which runs
    # Terraform first, because only the admin token can change them.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The real sitekey (repository variable, from the Terraform output); the build fails if it is unset.
      - run: pnpm build
        env:
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.PUBLIC_TURNSTILE_SITEKEY }}
      # Fails while a wrangler.toml still has a Terraform placeholder (run ./cli.sh deploy locally, commit the result).
      - name: Check the wrangler.toml files are synced
        run: bash scripts/check-synced.sh
      # The agent Worker goes first: Pages' AGENT service binding needs it to exist.
      - name: Deploy agent Worker
        working-directory: backend/agent
        run: pnpm exec wrangler deploy
      - name: Deploy Pages
        working-directory: backend/api
        run: pnpm exec wrangler pages deploy ../../web/build --project-name cloudie --branch main
