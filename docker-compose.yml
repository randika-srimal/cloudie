services:
  # The dev stack: SvelteKit (Vite, hot reload) on :5173 and the Pages Functions (wrangler pages dev) on :8788.
  # Packages install on start into the volumes below, so the repo folder never gets a node_modules.
  app:
    build: { context: ., dockerfile: docker/Dockerfile.dev }
    image: cloudie-dev:local
    # Host ports come from .env (copy .env.example) so several projects from this starter can run at once.
    ports:
      - '${WEB_PORT:-5173}:5173' # the site, with hot reload (open this one)
      - '${API_PORT:-8788}:8788' # Pages Functions + the last web build, as Cloudflare serves them
    volumes:
      - .:/app
      # Linux node_modules stay in the container; pnpm workspaces have one per package
      - node-modules:/app/node_modules
      - web-node-modules:/app/web/node_modules
      - api-node-modules:/app/backend/api/node_modules
      - protocol-node-modules:/app/shared/protocol/node_modules
      - wrangler-state:/app/.wrangler # local D1, R2, KV data survives restarts
      - pnpm-store:/pnpm-store
      - tf-plugin-cache:/tf-plugin-cache
    environment:
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-false} # set true on Windows/macOS if edits don't reload
    init: true
    stop_grace_period: 2s

  # The docsify site in docs/ at http://localhost:3000. Plain Node with a read-only mount: starts in a second.
  docs:
    image: node:26-alpine
    working_dir: /site
    volumes:
      - .:/site:ro
    ports:
      - '${DOCS_PORT:-3000}:3000'
    command: node scripts/docs-serve.mjs
    init: true
    stop_grace_period: 1s

  # Playwright end-to-end tests against the running dev stack: ./cli.sh e2e (or docker compose run --rm e2e).
  # Shares the app container's network, so localhost:5173 is the dev server. Only starts when asked for.
  e2e:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    profiles: [e2e]
    network_mode: service:app
    depends_on: [app]
    ipc: host
    init: true
    working_dir: /repo/e2e
    volumes:
      - .:/repo
      - e2e-node-modules:/repo/e2e/node_modules
    environment:
      - CI=1
    entrypoint:
      [
        'sh',
        '-c',
        'npm ci --no-audit --no-fund --loglevel=error && npx playwright test "$$@"',
        '--',
      ]

  # The Flutter toolbox for mobile/. Only runs through ./cli.sh app <command>, one command at a time.
  flutter:
    build: { context: ., dockerfile: docker/flutter.Dockerfile }
    image: cloudie-flutter:local
    profiles: [mobile]
    working_dir: /app/mobile
    extra_hosts:
      - 'host.docker.internal:host-gateway' # Docker Desktop sets this already; plain Docker Engine needs it
    environment:
      - TERM=${TERM:-xterm-256color}
      - ADB_SERVER_SOCKET=tcp:host.docker.internal:5037 # this computer's adb server; the phone stays plugged in here
      - LAN_IP=${LAN_IP:-}
      - SHARE_PORT=${SHARE_PORT:-8790}
      - DEV_PORT=${API_PORT:-8788} # what `app apk --local|--usb` connects to
      - APP_URL=${APP_URL:-}
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    volumes:
      - .:/app
      - android-sdk:/opt/android-sdk # packages Gradle downloads are kept
      - pub-cache:/root/.pub-cache
      - gradle-cache:/root/.gradle

  # Serves mobile/out/ (the debug APK) to phones on the same Wi-Fi: ./cli.sh app share.
  share:
    image: busybox:1.37
    profiles: [mobile]
    command: ['httpd', '-f', '-v', '-p', '8790', '-h', '/srv', '-c', '/etc/httpd.conf']
    volumes:
      - ./mobile/out:/srv:ro
      - ./docker/share-httpd.conf:/etc/httpd.conf:ro
    ports:
      - '0.0.0.0:${SHARE_PORT:-8790}:8790'
    stop_grace_period: 1s

volumes:
  node-modules:
  web-node-modules:
  api-node-modules:
  protocol-node-modules:
  wrangler-state:
  pnpm-store:
  tf-plugin-cache:
  e2e-node-modules:
  android-sdk:
  pub-cache:
  gradle-cache:
