name: cloudie
description: "Cloudie: Android and iOS app on the Cloudflare backend in ../backend."
publish_to: 'none'

# version: name+build. The number after + must go up for every Google Play / App Store upload.
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  go_router: ^18.1.4
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

# ./cli.sh app icons: launcher icon and splash screen from assets/branding/icon.png (1024×1024).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#E8762D"
  adaptive_icon_foreground: assets/branding/icon-foreground.png
  min_sdk_android: 24

flutter_native_splash:
  color: "#E8762D"
  image: assets/branding/icon-foreground.png
  android_12:
    color: "#E8762D"
    image: assets/branding/icon-foreground.png
