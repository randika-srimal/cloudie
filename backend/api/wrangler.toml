# One Cloudflare Pages project: the static site in web/build plus the Pages Functions in ./functions.
# `name` must match pages_project_name in backend/infra/variables.tf.
name = "cloudie"
pages_build_output_dir = "../../web/build"
compatibility_date = "2026-11-01"

# Plain (non-secret) settings, readable as env.<NAME>. Secrets: ./cli.sh set-secret (never in this file).
[vars]
APP_VERSION = "0.1.0"
# Origins allowed to open the chat (comma-separated): the addresses the chat page is served from, not HubSpot's.
# This top-level value is for local dev (`wrangler pages dev`); production uses [env.production.vars] below.
ALLOWED_ORIGINS = "http://localhost:5173"

# Production only (Pages deploys on the production branch). `vars` are not inherited from the top level, so
# APP_VERSION repeats. ALLOWED_ORIGINS is written by `./cli.sh infra-write-config` from the Terraform output
# chat_origins (the pages.dev address and the custom domains); the placeholder is never deployed unsynced.
# Preview deployments keep the local value, so the chat does not run on preview addresses.
[env.production.vars]
APP_VERSION = "0.1.0"
ALLOWED_ORIGINS = "https://cloudie.pages.dev" # tf-sync

# The agent Worker (backend/agent). The /agents/* proxy forwards to it and calls its allowConnect RPC.
# Locally, `wrangler pages dev` reaches the `wrangler dev` of backend/agent through the dev registry (both run
# under `pnpm dev`). There is no [[ratelimits]] here: Pages projects do not support rate-limit bindings, so the
# connect limit (CONNECT_LIMIT) lives on the agent Worker.
[[services]]
binding = "AGENT"
service = "cloudie-agent"

# Add bindings here when the project needs them, then create the resource in backend/infra/main.tf:
#
# [[d1_databases]]
# binding = "DB"
# database_name = "cloudie-db"
# database_id = "00000000-0000-0000-0000-000000000000"
# migrations_dir = "../migrations"
#
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "cloudie-files"
#
# [[kv_namespaces]]
# binding = "KV"
# id = "..."
