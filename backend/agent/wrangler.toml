# The sales-assistant agent Worker: a Cloudflare Agents SDK Durable Object (SalesAgent) behind /agents/*.
name = "cloudie-agent"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
# Only the Pages project reaches this Worker, through its AGENT service binding. A workers.dev or preview
# address would let anyone open /agents/* directly and skip the proxy's Origin, connect-limit and Turnstile guards.
workers_dev = false
preview_urls = false

# Secrets (CF_AIG_TOKEN, provider keys): ./cli.sh set-secret, never in this file.
[vars]
# Written by `./cli.sh infra-write-config` (part of `./cli.sh deploy`) from the Terraform output ai_gateway_url.
AI_GATEWAY_URL = "https://gateway.ai.cloudflare.com/v1/ACCOUNT_ID/cloudie-assistant" # tf-sync

[[durable_objects.bindings]]
name = "SalesAgent"
class_name = "SalesAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SalesAgent"]

# The id is written by `./cli.sh infra-write-config` from the Terraform output kv_config_id (the all-zero
# value is the placeholder before the first infra-apply). Commit the real id: it is not a secret.
[[kv_namespaces]]
binding = "CONFIG"
id = "00000000000000000000000000000000" # tf-sync

# Terraform creates this bucket (cloudflare_r2_bucket.kb); the name is fixed in backend/infra/main.tf.
[[r2_buckets]]
binding = "KB"
bucket_name = "cloudie-kb"

# namespace_id: any positive integer, unique per Cloudflare account (not a resource Terraform creates). Pick
# different numbers if another Worker in the account already uses 1001 or 1002.
[[ratelimits]]
name = "RATE_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 20
  period = 60

# Checked by the Pages proxy over RPC (allowConnect): Pages Functions cannot have a rate-limit binding.
[[ratelimits]]
name = "CONNECT_LIMIT"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 10
  period = 60

[observability]
enabled = true
